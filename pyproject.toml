[project]
name = "economist-rss"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.14",
    "pymupdf>=1.28.2",
]

[project.scripts]
ersr = "ersr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ersr"]
